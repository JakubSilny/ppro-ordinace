spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ordinace}
    username: ${DB_USER:ordinace}
    password: ${DB_PASSWORD:ordinace}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    time-zone: Europe/Prague
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  forward-headers-strategy: framework
app:
  users: ${APP_USERS:}
