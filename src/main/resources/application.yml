spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ordinace}
    username: ${DB_USER:ordinace}
    password: ${DB_PASSWORD:ordinace}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # demo data mají verzi V100: novější migrace (V5…) se musí spustit i po ní a po vypnutí dema nesmí
    # chybějící V100 zastavit start
    out-of-order: true
    ignore-migration-patterns: "*:missing"
  jackson:
    time-zone: Europe/Prague
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  forward-headers-strategy: framework
app:
  users: ${APP_USERS:}
  admins: ${APP_ADMINS:}
