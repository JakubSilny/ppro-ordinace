name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # jednotkové testy (surefire) i integrační *IT proti Postgresu z Testcontainers (failsafe)
      - run: ./mvnw -B verify
      - name: Coverage summary
        run: |
          awk -F, 'NR > 1 { missed += $8; covered += $9 }
            END { printf "### Pokrytí řádků testy: %.1f %%\n", 100 * covered / (missed + covered) }' \
            target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks u pull requestu čte seznam jeho commitů
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # hesla a klíče nesmí být v repozitáři ani v historii
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: PDF documentation is not older than its source
        run: |
          md=$(git log -1 --format=%ct -- docs/dokumentace.md)
          pdf=$(git log -1 --format=%ct -- docs/dokumentace.pdf)
          if [ "$md" -gt "$pdf" ]; then
            echo "::error file=docs/dokumentace.pdf::docs/dokumentace.md se změnil po posledním PDF, přegenerujte ho (README, oddíl Dokumentace)"
            exit 1
          fi

  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ordinace-app .
      # známé zranitelnosti v základním obrazu a v knihovnách aplikace; padá jen na opravitelné vysoké a kritické
      - uses: anchore/scan-action@v6
        with:
          image: ordinace-app
          severity-cutoff: high
          only-fixed: true
          output-format: table

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_USERS: e2e:e2e-password-123
      E2E_USER: e2e
      E2E_PASSWORD: e2e-password-123
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start app and database
        run: docker compose up -d --build
      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/login.html > /dev/null && exit 0
            sleep 2
          done
          docker compose logs app
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: e2e
        run: npm test
      - if: failure()
        run: docker compose logs app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
