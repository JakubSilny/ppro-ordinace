name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # jednotkové testy (surefire) i integrační *IT proti Postgresu z Testcontainers (failsafe)
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_USERS: e2e:e2e-password-123
      E2E_USER: e2e
      E2E_PASSWORD: e2e-password-123
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start app and database
        run: docker compose up -d --build
      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/login.html > /dev/null && exit 0
            sleep 2
          done
          docker compose logs app
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: e2e
        run: npm test
      - if: failure()
        run: docker compose logs app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
