# Jeden pull request měsíčně za ekosystém místo jednoho za každou knihovnu.
# Nové hlavní verze knihoven (např. Spring Boot 4) se neberou, ty se přechází ručně;
# GitHub Actions se aktualizují i o hlavní verze.
# Docker image tu nejsou: tagy 21-jre a 3.9-eclipse-temurin-21 jsou plovoucí, takže každý build
# stáhne opravenou Javu 21, a zranitelnosti v image hlídá Grype v CI.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      maven:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    groups:
      e2e:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
